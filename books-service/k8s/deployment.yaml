apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-service
  labels:
    app: books-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-service
  template:
    metadata:
      labels:
        app: books-service
    spec:
      containers:
        - name: books-service
          image: khawlarouiss/books-service:PLACEHOLDER
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: books-service-config
